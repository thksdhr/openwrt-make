name: MakeConfigration

on:
  workflow_dispatch: # 手动触发

jobs:
  work:
    runs-on: ubuntu-24.04

    steps:
      - name: "Copy Source"
        uses: actions/checkout@v4

      - name: "Init"
        run: |
          bash init.sh

      - name: "Configure Build"
        uses: mxschmitt/action-tmate@v3

      - name: "Upload Configration"
        uses: actions/upload-artifact@v4
        with:
          name: OpenWRT-MakeConfigration
          path: ~/openwrt/.config
